<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#181a28" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Small games for your phone: Mini Golf, Connect Four and more. Play solo, pass the phone or play a friend online."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Games" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Games</title>
  </head>
  <body>
    <!-- The game menu. Each game adds its own screens when it first opens. -->
    <section class="screen" id="games" data-screen>
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">
          <i style="background: #ff5c4d"></i><i style="background: #ffd23f"></i
          ><i style="background: #3b8cff"></i><i style="background: #4ac46e"></i>
        </div>
        <h1>Games</h1>
        <p>Pick a game. Play solo, pass the phone or play a friend.</p>
      </header>
      <nav class="tiles" id="tiles" aria-label="Games"></nav>
      <p class="soon">More games coming soon</p>
    </section>

    <div class="menu-toast" id="menu-toast" role="status"></div>
    <script type="module" src="/src/shell/main.ts"></script>
  </body>
</html>
