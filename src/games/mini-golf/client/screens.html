<!-- Mini golf screens, added to the page the first time the game opens. -->

<!-- Home -->
<section class="screen" id="home" data-screen>
  <div class="bar">
    <button class="back" data-menu aria-label="All games">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
    </button>
  </div>
  <div class="hero">
    <svg class="hero-art" viewBox="0 0 200 150" aria-hidden="true">
      <rect class="hero-green" x="14" y="14" width="172" height="126" rx="14" />
      <path class="hero-path" d="M40 124 L96 88 L112 56" />
      <circle class="hero-cup" cx="118" cy="46" r="11" />
      <path class="hero-pole" d="M118 44 V8" />
      <path class="hero-flag" d="M118 8 L140 15 L118 22 Z" />
      <circle class="hero-ball" cx="40" cy="124" r="8" />
    </svg>
    <h1 class="logo"><span>Mini</span><span>Golf</span></h1>
    <p class="tagline" id="home-tagline"></p>
  </div>
  <div class="actions">
    <button class="btn primary" id="go-play">Tee off</button>
    <button class="btn outline" id="resume-local" hidden>Resume your game</button>
  </div>
  <p class="best" id="solo-best" hidden></p>
  <button class="sound-toggle" id="sound-toggle" aria-pressed="true">Sound on</button>
</section>

<!-- Game -->
<section class="screen" id="game" data-screen>
  <header class="hud">
    <div class="hud-player" id="hud-0" style="--c: var(--p1)">
      <div class="hud-name"></div>
      <div class="hud-meta"></div>
    </div>
    <div class="hud-hole">
      <div class="hud-num" id="hud-hole">H1</div>
      <div class="hud-par" id="hud-par">par 2</div>
    </div>
    <div class="hud-player right" id="hud-1" style="--c: var(--p2)">
      <div class="hud-name"></div>
      <div class="hud-meta"></div>
    </div>
  </header>
  <main class="stage" id="stage">
    <canvas id="canvas"></canvas>
    <div class="callout" id="callout" aria-live="polite"></div>
    <div class="banner" id="banner" role="status" hidden></div>
    <div class="toast" id="toast" role="status"></div>
  </main>
  <footer class="turnbar">
    <div class="turn" id="turn">
      <i class="turn-ball"></i>
      <div class="turn-text">
        <div class="turn-who" id="turn-who"></div>
        <div class="turn-tip" id="turn-tip"></div>
      </div>
      <div class="turn-strokes"><b id="turn-strokes">1</b><small>stroke</small></div>
    </div>
    <button class="menu-btn" id="menu-btn" aria-label="Menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" /></svg>
    </button>
  </footer>
</section>

<!-- Overlays -->
<div class="modal" id="handoff" hidden>
  <div class="panel">
    <div class="big-ball" id="handoff-ball"></div>
    <h2 id="handoff-title">Pass to Kai</h2>
    <p class="sub" id="handoff-sub">Hand the phone over</p>
    <button class="btn primary" id="handoff-ready">I'm ready</button>
  </div>
</div>

<div class="modal" id="scorecard" hidden>
  <div class="panel">
    <h2 id="score-title">Hole 1 clear</h2>
    <p class="sub" id="score-sub"></p>
    <div class="card-scroll" id="score-scroll"><table class="card-table" id="score-table"></table></div>
    <button class="btn primary" id="score-next">Next hole</button>
    <button class="btn ghost" id="score-home" hidden>Home</button>
    <p class="note center" id="score-note"></p>
  </div>
</div>

<div class="modal" id="menu" hidden>
  <div class="panel">
    <h2>Menu</h2>
    <button class="btn primary" id="menu-resume">Resume</button>
    <button class="btn outline" id="menu-sound">Sound on</button>
    <button class="btn ghost danger" id="menu-quit">Leave game</button>
  </div>
</div>

<div class="flash" id="flash"></div>
